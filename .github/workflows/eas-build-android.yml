name: EAS Android Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-build-android.yml
      - frontend/app.json
      - frontend/eas.json
      - frontend/assets/images/fitai-app-icon.png

permissions:
  contents: read

concurrency:
  group: eas-android-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Build Android production bundle
        run: cd frontend && eas build --platform android --profile production --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
